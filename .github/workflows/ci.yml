name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install desktop UI dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[ui]"
      - name: Install FFmpeg (optional; enables the MP4 recording tests)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress
      - name: Windows H.264 encoder (Media Foundation) availability
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -c "from screenpilot.recording import mediafoundation as m; print(m.availability())"
      - name: Unit, Windows integration and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          SCREENPILOT_UI_SHOTS: ui-screenshots
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -q -p no:cacheprovider --junitxml=junit.xml 2>&1 | tee pytest.log
      - name: Report test summary and failures as annotations
        if: always()
        shell: bash
        run: python scripts/junit_annotations.py junit.xml pytest.log
      - name: CLI smoke test
        if: runner.os == 'Windows'
        run: |
          python -m screenpilot version
          python -m screenpilot monitors
          python -m screenpilot --lang ro hotkeys
          python -m screenpilot capture all --out smoke/all.png
          python -m screenpilot capture region --rect 0,0,320,200 --out smoke/region.png
          python -m screenpilot diagnostics --out smoke/diagnostics.zip
          python -m screenpilot record --rect 0,0,640,360 --seconds 2 --format gif --out smoke/recording.gif
          python -m screenpilot record-info
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            python -m screenpilot record --rect 0,0,640,360 --seconds 3 --format mp4 --out smoke/recording.mp4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Per-user install script (venv, shortcut, autostart, uninstall)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sp-install"
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -Autostart -NoLaunch -InstallDir $dir
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\ScreenPilot.lnk"
          if (-not (Test-Path $lnk)) { throw "Start-menu shortcut missing" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").ScreenPilot
          Write-Host "Run entry: $run"
          if ($run -notlike "*pythonw.exe*--autostart*") { throw "autostart entry wrong: $run" }
          & (Join-Path $dir "venv\Scripts\python.exe") -m screenpilot version
          powershell -ExecutionPolicy Bypass -File scripts\uninstall.ps1 -InstallDir $dir
          if (Test-Path $lnk) { throw "shortcut not removed" }
          $after = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").ScreenPilot
          if ($after) { throw "autostart entry not removed" }
      - name: Upload smoke captures
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-captures-py${{ matrix.python }}
          path: smoke/
      - name: Upload UI screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-py${{ matrix.python }}
          path: ui-screenshots/
          if-no-files-found: ignore

  publish-screenshots:
    # Publishes the UI screenshots to the 'ci-screenshots' branch so they can be
    # reviewed from anywhere (GitHub mobile app, raw links) without downloading artifacts.
    name: Publish UI screenshots
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-screenshots-py3.12
          path: shots
      - name: Push to ci-screenshots branch
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# ScreenPilot UI screenshots\n\nGenerated by CI from %s.\n' "${GITHUB_SHA::7}" > README.md
          for f in *.png; do printf '\n## %s\n\n![%s](%s)\n' "$f" "$f" "$f" >> README.md; done
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

  package:
    # Portable Windows build (no Python needed) published as the "nightly" pre-release.
    name: Portable package
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ui]" "pyinstaller>=6.6"
      - name: Build
        shell: bash
        run: |
          VERSION=$(python -c "import screenpilot; print(screenpilot.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python -m PyInstaller --noconfirm --clean --windowed --name ScreenPilot \
            --collect-data screenpilot \
            --exclude-module tkinter --exclude-module unittest --exclude-module pydoc \
            packaging/screenpilot_gui.py
          touch dist/ScreenPilot/portable.flag
          cp README.md docs/releases/$VERSION.md dist/ScreenPilot/ 2>/dev/null || cp README.md dist/ScreenPilot/
          du -sh dist/ScreenPilot
      - name: Self-test the packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          $p = Start-Process -FilePath dist\ScreenPilot\ScreenPilot.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist\ScreenPilot\self-test.txt -ErrorAction SilentlyContinue
          Remove-Item dist\ScreenPilot\self-test.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Zip
        shell: pwsh
        run: |
          $name = "ScreenPilot-$env:VERSION-portable-win64.zip"
          Compress-Archive -Path dist\ScreenPilot -DestinationPath $name
          "ZIP=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "{0:N1} MB" -f ((Get-Item $name).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-win64
          path: ${{ env.ZIP }}
      - name: Publish nightly pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly "$ZIP" --prerelease --target "$GITHUB_SHA" \
            --title "ScreenPilot $VERSION nightly (${GITHUB_SHA::7})" \
            --notes "Portable build: unzip and run ScreenPilot.exe. No installation or Python needed. Settings stay in the UserData folder next to the app. Release notes: docs/releases/$VERSION.md"
