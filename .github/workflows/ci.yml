name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install desktop UI dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[ui]"
      - name: Unit, Windows integration and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          SCREENPILOT_UI_SHOTS: ui-screenshots
        run: python -m pytest -q --junitxml=junit.xml
      - name: Report test summary and failures as annotations
        if: always()
        run: python scripts/junit_annotations.py junit.xml
      - name: CLI smoke test
        if: runner.os == 'Windows'
        run: |
          python -m screenpilot version
          python -m screenpilot monitors
          python -m screenpilot --lang ro hotkeys
          python -m screenpilot capture all --out smoke/all.png
          python -m screenpilot capture region --rect 0,0,320,200 --out smoke/region.png
      - name: Upload smoke captures
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-captures-py${{ matrix.python }}
          path: smoke/
      - name: Upload UI screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-py${{ matrix.python }}
          path: ui-screenshots/
          if-no-files-found: ignore

  publish-screenshots:
    # Publishes the UI screenshots to the 'ci-screenshots' branch so they can be
    # reviewed from anywhere (GitHub mobile app, raw links) without downloading artifacts.
    name: Publish UI screenshots
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-screenshots-py3.12
          path: shots
      - name: Push to ci-screenshots branch
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# ScreenPilot UI screenshots\n\nGenerated by CI from %s.\n' "${GITHUB_SHA::7}" > README.md
          for f in *.png; do printf '\n## %s\n\n![%s](%s)\n' "$f" "$f" "$f" >> README.md; done
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
